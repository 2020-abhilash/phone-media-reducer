[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phone-media-reducer"
version = "0.1.0"
description = "Batch compress phone videos to H.265 while preserving metadata, timestamps, and quality"
readme = "README.md"
license = "MIT"
authors = [{ name = "Abhilash" }]
requires-python = ">=3.13"
keywords = ["video", "compression", "h265", "hevc", "ffmpeg", "exiftool", "phone-backup"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = [
    "ffmpeg-python>=0.2.0",
    "pyexiftool>=0.5.6",
    "rich>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/2020-abhilash/phone-media-reducer"
Repository = "https://github.com/2020-abhilash/phone-media-reducer"
Issues = "https://github.com/2020-abhilash/phone-media-reducer/issues"

[project.scripts]
phone-media-reducer = "phone_media_reducer.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=phone_media_reducer --cov-report=term-missing --cov-branch"

